<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" role="img" aria-labelledby="t d">
  <title id="t">Вход по ключу доступа</title>
  <desc id="d">Закрытый ключ остается на устройстве, сервер хранит только открытый ключ и проверяет подпись под одноразовым запросом.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#0f766e"/></marker></defs>
  <rect width="900" height="330" rx="16" fill="#f8fafc"/>
  <g font-family="Georgia, 'Times New Roman', serif" fill="#0f172a" font-size="16">
    <rect x="40" y="40" width="260" height="250" rx="12" fill="#fff" stroke="#0f766e" stroke-width="2"/>
    <text x="170" y="72" text-anchor="middle" font-weight="bold" font-size="18">Устройство пользователя</text>
    <text x="170" y="112" text-anchor="middle">Закрытый ключ</text>
    <text x="170" y="136" text-anchor="middle" fill="#0f766e" font-weight="bold">никогда не покидает</text>
    <text x="170" y="158" text-anchor="middle" fill="#0f766e" font-weight="bold">устройство</text>
    <text x="170" y="206" text-anchor="middle">Подтверждение:</text>
    <text x="170" y="230" text-anchor="middle">отпечаток, лицо или PIN</text>
    <rect x="600" y="40" width="260" height="250" rx="12" fill="#fff" stroke="#0f766e" stroke-width="2"/>
    <text x="730" y="72" text-anchor="middle" font-weight="bold" font-size="18">Сервис</text>
    <text x="730" y="112" text-anchor="middle">Хранит только</text>
    <text x="730" y="136" text-anchor="middle" fill="#0f766e" font-weight="bold">открытый ключ</text>
    <text x="730" y="184" text-anchor="middle">Проверяет подпись</text>
    <text x="730" y="208" text-anchor="middle">под своим запросом</text>
    <text x="730" y="248" text-anchor="middle" font-size="14" fill="#64748b">Ключ привязан к домену:</text>
    <text x="730" y="268" text-anchor="middle" font-size="14" fill="#64748b">на фишинговом сайте он не сработает</text>
  </g>
  <g stroke="#0f766e" stroke-width="3" fill="none" marker-end="url(#a)">
    <path d="M600 110 H302" />
    <path d="M302 170 H598" />
  </g>
  <g font-family="Georgia, 'Times New Roman', serif" font-size="15" fill="#0f172a" text-anchor="middle">
    <text x="450" y="98">1. Одноразовый запрос</text>
    <text x="450" y="158">2. Подпись запроса закрытым ключом</text>
    <text x="450" y="230" fill="#64748b" font-size="14">3. Сервис проверяет подпись</text>
    <text x="450" y="250" fill="#64748b" font-size="14">открытым ключом и пускает пользователя</text>
  </g>
</svg>
